<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Paddle Ball Game</title>
  <style>
    /* Center the canvas on a black page */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Task 1: Canvas element, 600x300 pixels -->
  <canvas id="gameCanvas" width="600" height="300"></canvas>

  <script>
  (function () {
    'use strict';

    // ============================================================
    // Task 8: Customization settings
    // The customization section in tasks.md was left blank, so
    // these defaults are chosen to also satisfy requirements
    // 3.1-3.3 (white paddles/ball, black background).
    // ============================================================
    const CANVAS_WIDTH  = 600;
    const CANVAS_HEIGHT = 300;

    const BALL_COLOR       = 'white'; // Req 3.2
    const PADDLE_COLOR     = 'white'; // Req 3.1
    const BACKGROUND_COLOR = 'black';// Req 3.3

    const AI_DIFFICULTY = 0.7; // medium (easy 0.5 / medium 0.7 / hard 0.9 / impossible 1.0)
    const BALL_SPEED    = 4;   // normal (slow 3 / normal 4 / fast 6)
    const PADDLE_SPEED  = 5;   // normal (slow 3 / normal 5 / fast 7)

    const PADDLE_WIDTH  = 10;  // normal (thin 8 / normal 10 / thick 15)
    const PADDLE_HEIGHT = 80;  // normal (short 60 / normal 80 / tall 100)
    const BALL_RADIUS   = 6;

    // ============================================================
    // Task 1: Canvas setup (with the error check noted in design.md)
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) throw new Error('Canvas element not found');
    const ctx = canvas.getContext('2d');

    // ============================================================
    // Task 2: Game variables and initialization
    // Ball: x, y position and dx, dy speed
    // Paddles: leftY (AI), rightY (player)
    // ============================================================
    let ballX, ballY, ballDX, ballDY;
    let leftY, rightY;
    let leftScore = 0;   // AI / computer score (left side)
    let rightScore = 0;  // player score (right side)

    // Reset the ball to the center with a random direction.
    // `dir` (-1 or +1) sets the horizontal serve direction.
    function resetBall(dir) {
      ballX = CANVAS_WIDTH / 2;
      ballY = CANVAS_HEIGHT / 2;
      const direction = dir || (Math.random() < 0.5 ? -1 : 1);
      // small random launch angle so play is varied
      const angle = (Math.random() * 0.5 - 0.25) * Math.PI;
      ballDX = direction * BALL_SPEED * Math.cos(angle);
      ballDY = BALL_SPEED * Math.sin(angle);
      // guarantee visible vertical motion
      if (Math.abs(ballDY) < 1) ballDY = (Math.random() < 0.5 ? -1 : 1) * 1.5;
    }

    function init() {
      leftY = (CANVAS_HEIGHT - PADDLE_HEIGHT) / 2;
      rightY = (CANVAS_HEIGHT - PADDLE_HEIGHT) / 2;
      leftScore = 0;
      rightScore = 0;
      resetBall();
    }

    // ============================================================
    // Task 3: Drawing functions
    // ============================================================
    function draw() {
      // Paint the background (Req 3.3)
      ctx.fillStyle = BACKGROUND_COLOR;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      drawCenterLine(); // Task 9 polish
      drawScore();      // Task 8 scoreboard
      drawPaddles();    // Req 3.1
      drawBall();       // Req 3.2
    }

    function drawBall() {
      ctx.fillStyle = BALL_COLOR;
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPaddles() {
      ctx.fillStyle = PADDLE_COLOR;
      // Left (AI) paddle hugs the left edge
      ctx.fillRect(0, leftY, PADDLE_WIDTH, PADDLE_HEIGHT);
      // Right (player) paddle hugs the right edge
      ctx.fillRect(CANVAS_WIDTH - PADDLE_WIDTH, rightY, PADDLE_WIDTH, PADDLE_HEIGHT);
    }

    // Simple score display, top-center (Task 8 chosen style)
    function drawScore() {
      ctx.fillStyle = BALL_COLOR;
      ctx.font = '16px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('Player: ' + rightScore + '  |  Computer: ' + leftScore, CANVAS_WIDTH / 2, 10);
    }

    // Faint dashed center line (Task 9 polish)
    function drawCenterLine() {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]);
      ctx.beginPath();
      ctx.moveTo(CANVAS_WIDTH / 2, 0);
      ctx.lineTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT);
      ctx.stroke();
      ctx.restore();
    }

    // ============================================================
    // Task 5: Player input handling
    // Arrow keys move the right paddle; preventDefault stops page scroll.
    // ============================================================
    const keys = { ArrowUp: false, ArrowDown: false };

    window.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        keys[e.key] = true;
      }
    });

    window.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        keys[e.key] = false;
      }
    });

    // ============================================================
    // Task 4 & Task 6: Update (movement, collision, AI)
    // ============================================================
    function update() {
      // --- Move the ball ---
      ballX += ballDX;
      ballY += ballDY;

      // --- Top / bottom wall collision (Req 2.2) ---
      if (ballY - BALL_RADIUS < 0) {
        ballY = BALL_RADIUS;
        ballDY = -ballDY;
      } else if (ballY + BALL_RADIUS > CANVAS_HEIGHT) {
        ballY = CANVAS_HEIGHT - BALL_RADIUS;
        ballDY = -ballDY;
      }

      // --- Paddle collision (Req 2.1) ---
      // Right (player) paddle: ball moving right and overlapping paddle
      if (ballDX > 0 &&
          ballX + BALL_RADIUS >= CANVAS_WIDTH - PADDLE_WIDTH &&
          ballX - BALL_RADIUS <= CANVAS_WIDTH &&
          ballY + BALL_RADIUS >= rightY &&
          ballY - BALL_RADIUS <= rightY + PADDLE_HEIGHT) {
        ballX = CANVAS_WIDTH - PADDLE_WIDTH - BALL_RADIUS;
        ballDX = -Math.abs(ballDX);
        // Add a little "english" based on where the ball struck
        const hit = (ballY - (rightY + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        ballDY = hit * BALL_SPEED;
      }

      // Left (AI) paddle: ball moving left and overlapping paddle
      if (ballDX < 0 &&
          ballX - BALL_RADIUS <= PADDLE_WIDTH &&
          ballX + BALL_RADIUS >= 0 &&
          ballY + BALL_RADIUS >= leftY &&
          ballY - BALL_RADIUS <= leftY + PADDLE_HEIGHT) {
        ballX = PADDLE_WIDTH + BALL_RADIUS;
        ballDX = Math.abs(ballDX);
        const hit = (ballY - (leftY + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        ballDY = hit * BALL_SPEED;
      }

      // --- Off-screen reset (Req 2.3) + scoring ---
      if (ballX + BALL_RADIUS < 0) {
        // Ball passed the AI paddle -> player scores
        rightScore++;
        resetBall(-1); // serve toward the AI side
      } else if (ballX - BALL_RADIUS > CANVAS_WIDTH) {
        // Ball passed the player paddle -> computer scores
        leftScore++;
        resetBall(1); // serve toward the player side
      }

      // --- Player input -> move right paddle (Req 1.1, 1.2) ---
      if (keys.ArrowUp)   rightY -= PADDLE_SPEED;
      if (keys.ArrowDown) rightY += PADDLE_SPEED;
      // Keep paddle within canvas bounds (design.md: keep paddles on screen)
      if (rightY < 0) rightY = 0;
      if (rightY > CANVAS_HEIGHT - PADDLE_HEIGHT) rightY = CANVAS_HEIGHT - PADDLE_HEIGHT;

      // --- AI for left paddle (Req 1.3) ---
      // Follow the ball's Y position, capped to aiSpeed so it is beatable.
      const aiSpeed = PADDLE_SPEED * AI_DIFFICULTY;
      const targetY = ballY - PADDLE_HEIGHT / 2;
      if (Math.abs(leftY - targetY) > 2) {
        leftY += (leftY < targetY) ? aiSpeed : -aiSpeed;
      }
      if (leftY < 0) leftY = 0;
      if (leftY > CANVAS_HEIGHT - PADDLE_HEIGHT) leftY = CANVAS_HEIGHT - PADDLE_HEIGHT;
    }

    // ============================================================
    // Task 7: Game loop (setInterval ~60 FPS / 16ms)
    // ============================================================
    function gameLoop() {
      update();
      draw();
    }

    init();
    setInterval(gameLoop, 16);

    // ------------------------------------------------------------
    // Expose a small API to support the testing strategy in
    // design.md (property-based testing with fast-check).
    // ------------------------------------------------------------
    window.__game = {
      init: init,
      update: update,
      draw: draw,
      resetBall: resetBall,
      getState: function () {
        return {
          ballX: ballX, ballY: ballY, ballDX: ballDX, ballDY: ballDY,
          leftY: leftY, rightY: rightY,
          leftScore: leftScore, rightScore: rightScore
        };
      },
      // constants useful for tests
      config: {
        CANVAS_WIDTH: CANVAS_WIDTH, CANVAS_HEIGHT: CANVAS_HEIGHT,
        BALL_RADIUS: BALL_RADIUS, PADDLE_WIDTH: PADDLE_WIDTH,
        PADDLE_HEIGHT: PADDLE_HEIGHT, BALL_SPEED: BALL_SPEED,
        PADDLE_SPEED: PADDLE_SPEED, AI_DIFFICULTY: AI_DIFFICULTY
      }
    };
  })();
  </script>
</body>
</html>
